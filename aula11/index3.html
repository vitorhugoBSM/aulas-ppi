<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaja</title>
    <style>
        div#area{
            font: normal, 20pt arial;
            background: rgb(47,87,47);
            color: black;
            width: 200px;
            height: 200px;
            line-height: 200px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="area" onclick="clicar()" onmouseenter="entrar()" onmouseleave="sair()">
        interaja...
    </div>
    
    <script>
        function clicar(){
            var a = window.document.getElementById('area')
            a.innerText ='Clicou!!!'
            a.style.background = 'red'
        }
        function entrar(){
            var a = window.document.getElementById('area')
            a.innerText = 'entrou!!' 
            a.style.background = 'yellow'
        }
        function sair(){
            var a = window.document.getElementById('area')
            a.innerText = 'saiu!!' 
            a.style.background = 'purple'
        }
    </script>
</body>
</html>
